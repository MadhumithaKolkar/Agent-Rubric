[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrubric"
version = "0.1.1"
description = "AgentRubric: trajectory-level evaluation for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llm", "agents", "evaluation", "evals", "trajectory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=0.2.0"]
openai = ["openai>=1.0.0"]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/MadhumithaKolkar/Agent-Rubric"

[project.scripts]
agentrubric = "agentrubric.cli:main"